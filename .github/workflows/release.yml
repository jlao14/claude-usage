name: Release

# Push a tag like v1.2.0 to build, publish a GitHub release, and (optionally)
# update the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      # Fine-grained token with Contents read/write on <owner>/homebrew-tap. Optional.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app, zip and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=io.github.$OWNER_LC.claudeusage" >> "$GITHUB_ENV"
          VERSION="$VERSION" \
          BUNDLE_ID="io.github.$OWNER_LC.claudeusage" \
          REPO_URL="https://github.com/$OWNER/$REPO" \
            scripts/release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Claude-Usage-$VERSION.zip" \
            "dist/Claude-Usage-$VERSION.dmg" \
            "dist/Claude-Usage-$VERSION.sha256" \
            --title "Claude Usage $VERSION" \
            --generate-notes

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          SHA="$(shasum -a 256 "dist/Claude-Usage-$VERSION.zip" | cut -d' ' -f1)"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-tap.git" tap
          mkdir -p tap/Casks
          scripts/render-cask.sh "$VERSION" "$SHA" "$OWNER" "$REPO" "$BUNDLE_ID" > tap/Casks/claude-usage.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/claude-usage.rb
          git commit -m "claude-usage $VERSION"
          git push
